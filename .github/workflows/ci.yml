# Checks every push and pull request. It never deploys and uses no secrets.
#
# frontend: lint, production build, then the Playwright end-to-end suite
#           against that build (client/e2e; the analysis API and EmailJS are
#           mocked inside the tests).
# backend:  the pytest suite. The reference genomes, ClinVar, CIViC and SnpEff
#           data (server/resources/) are not in git, so the tests that need
#           them skip with a stated reason; everything else runs, including
#           the bcftools/samtools steps on tiny synthetic references.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Keep the Playwright report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          retention-days: 14

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt

      - name: Install bcftools, samtools and tabix
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bcftools samtools tabix

      - run: pip install -r requirements-dev.txt

      - name: pytest (tests needing server/resources/ skip with a reason)
        env:
          # An empty resources directory: CI must never depend on, or look
          # for, data outside the repository.
          ONCOTRACE_RESOURCES: ${{ runner.temp }}/no-resources
        run: python -m pytest -q -p no:cacheprovider -rs
