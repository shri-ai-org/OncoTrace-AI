<!doctype html>
<html lang="en">
  <head>

      name="description"
      content="Open-source, AI-powered mammogram and liquid biopsy analysis, with lung cancer CT imaging in development. Powered by Senus Healthcare Research Institute, USA."

    <!-- Icons: ribbon mark for small sizes, full logo for install icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- Social previews. Crawlers for these don't run JavaScript, so these

         titles are set at runtime by src/lib/seo.js. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OncoTrace-AI" />
    <meta property="og:title" content="OncoTrace-AI — Real-time Precision Monitoring of Oncology" />

      property="og:description"
      content="Open-source, AI-powered mammogram and liquid biopsy analysis, with lung cancer CT imaging in development. From a routine blood draw to an evidence-linked clinical report."
    />
    <meta property="og:url" content="https://www.oncotrace-ai.org/" />
    <meta property="og:image" content="https://www.oncotrace-ai.org/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OncoTrace-AI: Real-time Precision Monitoring of Oncology" />

      name="twitter:description"
      content="Open-source, AI-powered mammogram and liquid biopsy analysis, with lung cancer CT imaging in development. From a routine blood draw to an evidence-linked clinical report."
    />
    <meta name="twitter:image" content="https://www.oncotrace-ai.org/og-image.jpg" />
