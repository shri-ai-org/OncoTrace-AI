# Installed as /etc/fail2ban/filter.d/oncotrace-auth.conf
#
# Matches the line the backend logs for every refused demo sign-in or upload
# (app/core/security.py), as journald stores it:
#
#   2026-10-12 10:01:40,122 WARNING oncotrace.auth demo auth failure from 203.0.113.9 /api/v1/auth/verify
#
# The address is the real client: uvicorn takes it from the X-Forwarded-For
# nginx sets, trusting that header from 127.0.0.1 only.
#
# Anchored at the start of the line (optionally after the "host ident[pid]:"
# prefix fail2ban adds to journal entries, and the app's own timestamp) so text
# from an uploaded file that ends up in some other log line can never get an
# arbitrary address banned.
#
# Test against the live journal:
#   sudo fail2ban-regex systemd-journal oncotrace-auth

[Definition]
failregex = ^(?:\S+ \S+\[\d+\]: )?(?:\d{4}-\d\d-\d\d \d\d:\d\d:\d\d,\d+ )?WARNING oncotrace\.auth demo auth failure from <ADDR> /api/v1/[\w/]+$
ignoreregex =
journalmatch = _SYSTEMD_UNIT=oncotrace-backend.service
