# Installed as /etc/nginx/snippets/oncotrace-csp.conf
#
# Content-Security-Policy for the React site's HTML documents only. Included in
# the SPA `location /` and NOT at server level, so other apps proxied on this
# domain (e.g. /mammodemo/) are never affected by it.
#
#  script-src  'wasm-unsafe-eval'  the 3D DNA model uses the meshopt WebAssembly decoder
#  style-src   'unsafe-inline'     components render <style> blocks
#  connect-src api.emailjs.com     contact and booking forms
#              blob: data:         three.js loads textures embedded in the .glb
#  frame-src   'none'              the site embeds no iframes
#
# Adding a new third-party script, API, font or iframe? Add its origin here
# (an iframe needs frame-src changed from 'none' to that origin), or the
# browser will block it (visible as a "Refused to ..." console error).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data: https://api.emailjs.com; frame-src 'none'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
