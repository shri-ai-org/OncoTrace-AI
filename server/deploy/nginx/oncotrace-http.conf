# Installed as /etc/nginx/conf.d/oncotrace-http.conf
# (Ubuntu's nginx.conf includes conf.d/*.conf inside its http {} block.)
#
# Only directives that MUST live at http{} level go here. Do not add `gzip on;`
# or `sendfile` -- Ubuntu's nginx.conf already sets them, and repeating a
# directive at the same level fails `nginx -t` with "directive is duplicate".

# ---- Rate-limit zones -------------------------------------------------------
# The demo is guarded by ONE shared credential, which is inherently
# brute-forceable: /api/v1/auth/verify is a perfect oracle (200 vs 401), and so
# is /api/v1/vcf/analyze (401 vs anything else). These zones are the
# difference between "a few guesses a minute" and "millions"; fail2ban
# (server/deploy/fail2ban/) then bans an IP that keeps failing.
# 10m of shared memory holds roughly 160k client IPs per zone.
limit_req_zone  $binary_remote_addr zone=oncotrace_auth:10m   rate=5r/m;
limit_req_zone  $binary_remote_addr zone=oncotrace_upload:10m rate=2r/m;
limit_req_zone  $binary_remote_addr zone=oncotrace_api:10m    rate=60r/m;
limit_conn_zone $binary_remote_addr zone=oncotrace_conn:10m;
