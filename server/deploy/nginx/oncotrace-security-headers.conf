# Installed as /etc/nginx/snippets/oncotrace-security-headers.conf
#
# Why a snippet: nginx `add_header` directives are inherited by a location
# ONLY if that location sets no add_header of its own. Every location that adds
# e.g. Cache-Control therefore silently drops all server-level headers. Each
# such location includes this file again so the headers are always present.
#
# HSTS: browsers remember it for a year. Enable only once HTTPS works for
# www.oncotrace-ai.org AND every subdomain (includeSubDomains), otherwise drop
# includeSubDomains.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
