# Installed as /etc/nginx/sites-available/oncotrace (symlinked into sites-enabled)
#
# The complete site for www.oncotrace-ai.org: the React build (client/dist,
# copied to /var/www/oncotraceai) plus the FastAPI backend on 127.0.0.1:8000.
# Sized for an AWS t3.large (2 vCPU / 8 GB). See server/deploy/DEPLOY.md.
#
# Requires, installed alongside:
#   /etc/nginx/conf.d/oncotrace-http.conf               (rate-limit zones)
#   /etc/nginx/snippets/oncotrace-security-headers.conf
#   /etc/nginx/snippets/oncotrace-csp.conf
#
# HTTPS: run `sudo certbot --nginx -d www.oncotrace-ai.org -d oncotrace-ai.org`
# after installing this file. Certbot adds the `listen 443 ssl` + certificate
# lines and the HTTP->HTTPS redirect into the blocks below. Then enable HTTP/2
# by changing certbot's line to:   listen 443 ssl http2;   (nginx 1.24)
#                         or add:  http2 on;               (nginx >= 1.25.1)
# HTTP/2 multiplexes the ~10 parallel asset requests of the first page load
# over one connection.


# ---- Apex -> www -------------------------------------------------------------
# One canonical host, so caches, cookies and search rankings aren't split.
server {
    listen 80;
    listen [::]:80;
    server_name oncotrace-ai.org;
    return 301 https://www.oncotrace-ai.org$request_uri;
}


server {
    listen 80;
    listen [::]:80;
    server_name www.oncotrace-ai.org;

    root  /var/www/oncotraceai;
    index index.html;

    server_tokens off;

    # Must be at least the backend's ONCOTRACE_MAX_UPLOAD_BYTES (500 MB): the
    # nginx default (1 MB) would 413 real VCF uploads before they reach the
    # backend. The upload location below sets it again explicitly; the sign-in
    # location overrides it with a tiny limit.
    client_max_body_size 500M;

    include snippets/oncotrace-security-headers.conf;

    # ---- Compression ---------------------------------------------------------
    # `npm run build` writes a .gz (and .br) next to every compressible file at
    # maximum compression; gzip_static serves those with zero CPU per request.
    # Dynamic gzip below is only the fallback for anything not precompressed.
    gzip_static on;
    # Brotli is ~15-20% smaller than gzip for JS/CSS. One-time opt-in:
    #   sudo apt install libnginx-mod-http-brotli-static
    # then uncomment the next line and reload.
    # brotli_static on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml model/gltf-binary;

    # Cache open file descriptors / stat() results for static files: avoids a
    # filesystem lookup per request for the same handful of assets.
    open_file_cache          max=2000 inactive=60s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # ---- Backend API ---------------------------------------------------------
    # `^~` everywhere below: a matching prefix wins outright and regex
    # locations are not even consulted, so an API path can never be captured
    # by a static-file rule.

    # Sign-in: strictest limit. 5r/m + burst=3 gives a brute-forcer ~8 tries
    # in the first minute and 5/min after; a real user mistyping is never
    # blocked. It carries no body, so the body limit is tiny.
    location = /api/v1/auth/verify {
        limit_req  zone=oncotrace_auth burst=3 nodelay;
        limit_conn oncotrace_conn 10;
        limit_req_status 429;
        client_max_body_size 1k;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Upload + analysis. Every request here is also a credential check (401 vs
    # anything else), so under /api/'s 60r/m below it would be a far faster
    # password oracle than sign-in. 2r/m + burst=3 still lets a real user
    # upload, fix a file and retry within a minute.
    location = /api/v1/vcf/analyze {
        limit_req  zone=oncotrace_upload burst=3 nodelay;
        limit_conn oncotrace_conn 10;
        limit_req_status 429;
        client_max_body_size 500M;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uploads stream straight to the backend instead of being spooled to
        # disk by nginx first (up to 500 MB each). That is also what lets the
        # backend refuse a bad credential from the headers alone, before any
        # of the body has been sent on.
        proxy_request_buffering off;
        # ...which needs HTTP/1.1 keep-alive to the backend. Over nginx's
        # default HTTP/1.0, uvicorn closes the socket as soon as it has
        # answered; with upload bytes still unread, the kernel resets the
        # connection and nginx turns roughly a third of those early 401s into
        # 502s. Kept open, the backend drops the rest of the body unread and
        # nginx delivers the 401.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # A real VCF analysis can take a couple of minutes (bcftools/SnpEff);
        # nginx's 60s default would 504 while the backend is still working.
        # The backend caps its own external-tool time below this
        # (ONCOTRACE_TOOL_BUDGET_SECONDS, default 240s).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /api/ {
        limit_req  zone=oncotrace_api burst=20 nodelay;
        limit_conn oncotrace_conn 10;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- KEEP: other apps on this domain --------------------------------------
    # The site's "View Demo -> Mammogram" button opens
    # https://www.oncotrace-ai.org/mammodemo/ui. If that app is served by this
    # server block today, copy its existing `location /mammodemo/ { ... }`
    # block here unchanged, BEFORE replacing your current config.

    # Long-lived Cache-Control below is deliberately WITHOUT `always`, so it is
    # sent on successful responses only. With `always`, a file that is briefly
    # missing mid-deploy would have its 404 cached by browsers for a week (or a
    # year under /assets/). Security headers keep `always`.

    # ---- Hashed build output: cache forever ----------------------------------
    # Vite puts a content hash in every filename under /assets/
    # (index-DKhY4e2y.js), so a URL's content can never change; a deploy
    # produces new names. This is what makes repeat visits instant.
    location ^~ /assets/ {
        include snippets/oncotrace-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---- Unhashed public files: cache for a week -----------------------------
    # Referenced by fixed names (img1.webp, DNA_STRAND_NEW.glb), so not
    # immutable: an updated file is picked up within 7 days without renaming.
    # A missing file is a real 404, not index.html.
    location ~* \.glb$ {
        types { model/gltf-binary glb; }
        include snippets/oncotrace-security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    location ^~ /sample-vcf/ {
        types { text/plain vcf; }
        include snippets/oncotrace-security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:webp|avif|jpe?g|png|gif|svg|ico|woff2?)$ {
        include snippets/oncotrace-security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        include snippets/oncotrace-security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~ ^/(?:robots\.txt|sitemap\.xml)$ {
        include snippets/oncotrace-security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # ---- The React app --------------------------------------------------------
    # "/" is prerendered at build time (dist/index.html holds the real homepage
    # markup, which React then hydrates). Every other page route gets the empty
    # SPA shell (dist/app.html) and React Router renders it in the browser.
    #
    # Both HTML files are `no-cache` (revalidate every time, a cheap 304): they
    # name the current hashed assets, so a new deploy is visible immediately.
    location = / {
        include snippets/oncotrace-security-headers.conf;
        include snippets/oncotrace-csp.conf;
        add_header Cache-Control "no-cache" always;
        # A file found by a non-final try_files entry is served from THIS
        # location (no internal redirect), so the headers above apply.
        try_files /index.html =404;
    }

    # The prerendered homepage must only ever be served at "/": loaded at any
    # other URL, React would hydrate it against a different route.
    location = /index.html {
        return 301 /$is_args$args;
    }

    location = /app.html {
        internal;
        include snippets/oncotrace-security-headers.conf;
        include snippets/oncotrace-csp.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: BrowserRouter uses real paths (/blog/some-post), so any
    # path that isn't a file gets the shell and React Router takes over;
    # without this, refreshing any non-root route would 404 at nginx.
    #
    # No `$uri/` in try_files: public/blog/ (the blog's images) is a real
    # directory, so with `$uri/` the /blog page matched that folder instead and
    # returned 301 -> 403 Forbidden on every refresh or shared link.
    location / {
        include snippets/oncotrace-security-headers.conf;
        include snippets/oncotrace-csp.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /app.html;
    }
}
